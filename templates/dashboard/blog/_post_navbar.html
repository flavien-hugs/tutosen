<div class="row">

                    Total Posts
                </span>

                <div class="mt-2 d-flex justify-content-between align-items-center">
                    <div class="lh-1">

                        <span>{{ user.get_posts_last_count }} Last</span>
                    </div>
                    <div>

                            <i class="mdi mdi-text-box-multiple mdi-24px"></i>
                        </span>
                    </div>
                </div>
            </div>

    </div>

    <div class="col-xl-3 col-lg-6 col-md-12 col-12">

                    Assets
                </span>
                
                <div class="mt-2 d-flex justify-content-between align-items-center">
                    <div class="lh-1">

                        <span>300+ Media</span>
                    </div>
                    <div>
                        <span class="bg-light-warning icon-shape icon-xl rounded-lg text-dark-warning">

                        </span>
                    </div>
                </div>

    </div>

    <div class="col-xl-3 col-lg-6 col-md-12 col-12">

                </div>

    </div>

    <div class="col-xl-3 col-lg-6 col-md-12 col-12">

            <div class=" card-body">
                <span class="font-size-xs text-uppercase font-weight-semi-bold">Comments</span>
                <div class="mt-2 d-flex justify-content-between align-items-center">

                        <span>20+ Comments</span>
                    </div>
                    <div>
                        <span class="bg-light-info icon-shape icon-xl rounded-lg text-dark-info">

                        </span>
                    </div>

            </div>
