{% for object in subjects %}
	<li class="list-group-item px-0">
		<div class="row">
			<div class="col-auto">
				<a href="{{ object.get_subject_course_list_url }}">
					<img src="{% if object.image %}{{ object.image.url }}{% else %}{{ STATIC_PREFIX }}img/cours/empty.jpg{% endif %}"
						alt="{{ object.title }}"
					class="img-fluid rounded img-4by3-lg"/>
				</a>
			</div>

			<div class="col pl-0">
				<a href="{{ object.get_subject_course_list_url }}">
					<h5 class="text-primary-hover">
						{{ object.title|capfirst|safe }}
					</h5>
				</a>
				<span class="mr-2 font-size-xs">
					<span class="mr-2 font-size-xs">
						<span class="text-dark  mr-1 font-weight-semi-bold">8,000</span>
						Students
					</span>

					<span class="font-size-xs">
						<span class="text-dark  mr-1 font-weight-semi-bold">33,000</span>
                           Reviews
                    </span>
                </span>
            </div>

			<div class="col-auto">
				<span class="dropdown dropleft">
					<a class="text-muted text-decoration-none" href="#!" role="button" id="courseDropdown"
						data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
						<i class="fe fe-more-vertical"></i>
					</a>

					<span class="dropdown-menu" aria-labelledby="courseDropdown">
						<span class="dropdown-header">Actions</span>

						<a class="dropdown-item" href="{{ object.get_subject_update_url }}">
							<i class="fe fe-edit dropdown-item-icon"></i>
							Edit
						</a>

						<a class="dropdown-item" href="{{ object.get_subject_delete_url }}">
							<i class="fe fe-trash dropdown-item-icon "></i>
							Remove
						</a>
					</span>
				</span>
			</div>
		</div>
	</li>
{% endfor %}
