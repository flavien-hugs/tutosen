{% if is_paginated %}
    <div class="col-lg-12 col-md-12 col-12">
        <nav aria-label="page navigation">

            <ul class="pagination justify-content-center mb-0">
                {% if page_obj.has_previous %}
                <li class="page-item">
                    <a class="page-link mx-1 rounded shadow-lg" href="?page={{ page_obj.previous_page_number }}" tabindex="-1" aria-disabled="true">
                        <i class="mdi mdi-arrow-left-bold"></i>
                    </a>
                </li>
                {% endif %}

                <li class="page-item">
                    <span class="page-link mx-1 rounded shadow-lg">
                        {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}
                    </span>
                </li>

                {% if page_obj.has_next %}
                    <li class="page-item">
                        <a class="page-link mx-1 rounded shadow-lg" href="?page={{ page_obj.next_page_number }}">
                            <i class="mdi mdi-arrow-right-bold"></i>
                        </a>
                    </li>
                {% endif %}
            </ul>

        </nav>
    </div>
{% endif %}
