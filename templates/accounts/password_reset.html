{% extends "index.html" %}

{% comment %} page de connexion {% endcomment %}

{% block page_content %}

    {% url 'home' as home_url %}
    {% url 'accounts:signup_url' as signup_url %}

    <div class="container d-flex flex-column">
        <div class="row align-items-center justify-content-center no-gutters min-vh-100">
            <div class="col-lg-5 col-md-8 py-8 py-xl-0">
                <div class="card shadow">
                    <div class="card-body p-6">
                        <div class="mb-4">
                            <a href="{{ home_url }}">
                                <img src="{{ STATIC_PREFIX }}img/logo-icon.svg" class="mb-4" alt="{{ title }}">
                            </a>

                            <h1 class="mb-1 font-weight-bold">
                                Mot de passe oublié
                            </h1>
                        </div>

                        <form>
                            <div class="form-group">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" class="form-control" name="email" placeholder="Entrer votre adresse électronique"
                                required>
                            </div>

                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary btn-block">
                                    Envoyer le lien de réinitialisation
                                </button>
                            </div>
                            <span>Retourner à la page <a href="{{ signup_url }}">d'Inscription</a></span>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock page_content %}
