{% url 'account_login' as account_login %}
{% url 'account_signup' as account_signup %}

<div class="py-lg-16 py-10 bg-dark" style="background:url({{ STATIC_PREFIX }}img/call-to-action.svg) no-repeat; background-size: cover; background-position: top center">
    <div class="container">
        <div class="row justify-content-center text-center">
            <div class="col-md-9 col-12">
                <h2 class="display-4 text-white">Join more than 1 million learners worldwide</h2>
                <p class="lead text-white px-lg-12 mb-6">Effective learning starts with assessment. Learning a new skill is hard work—Signal makes it easier.</p>
                <div class="d-grid d-md-block">
                    <a href="{{ account_login }}" class="btn btn-primary mb-2 mb-md-0">Start Learning for Free</a>
                    <a href="{{ account_signup }}" class="btn btn-info">Geeks for Business</a>
                </div>
            </div>
        </div>
    </div>
</div>
