    <div class="pt-lg-4 pb-lg-3 pt-4 pb-6">
        <div class="container">
            <div class="row mb-4">
                <div class="col">
                    <h2 class="mb-0">Cours récememnts ajoutés</h2>
                </div>
            </div>

            <div class="row">
                {% for object in latest_course %}
                    {% include 'courses/snippets/_snippet_course_card.html' with object=object %}
                {% endfor %}
            </div>
        </div>
    </div>
{% endif %}
