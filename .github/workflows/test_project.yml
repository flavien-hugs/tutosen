# This is a basic workflow that is manually triggered

name: Test Application Django CI

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - '**.md'
    pull_request:
      paths-ignore:
        - main
        - '**.md'
    schedule:
      - cron: 0 2 * *5
  workflow_dispatch:
    inputs:
      name:
        description: 'Person to greet'
        default: 'World'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4

    steps:
    - uses: actions/checkout@v2
    - name: Send greeting
      run: echo "Hello ${{ github.event.inputs.name }}"

    - name: Set up python
      uses: actions/setup-python@v1
      with:
        python-version: '3.x'
        architecture: 'x64'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ./web/requirements.txt

    - name: Run Test Application
      env:
        SECRET: 69pbav1&&+wdea&&^36o0fx-b00i1dhxb(efnfixj$df=@u*&2
        DATABASE_NAME: tutosen_db
        DATABASE_USER: tutosen
        DATABASE_PASSWORD: tutosen
        DJANGO_ALLOWED_HOSTS: localhost 127.0.0.1 [::1]
        DEBUG_MODE: False
      run: |
        python ./web/manage.py check --deploy
